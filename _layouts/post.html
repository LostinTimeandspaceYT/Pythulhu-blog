---
layout: default
---

<article>
  <h1 class="text-2xl mb-2">{{ page.title }}</h1>
  <p class="text-sm text-[#aaa] mb-6">{{ page.date | date: "%B %-d, %Y" }}</p>

  {{ content }}

  <p class="mt-10">
    <a href="{{ "/" | relative_url }}" class="text-sm text-[#c4b89c] hover:text-[#f4e3b2] underline">
      ← Back to Home
    </a>
  </p>
</article>
